<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efecdf">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 8 8%27%3E%3Crect width=%278%27 height=%278%27 fill=%27%23efecdf%27/%3E%3Crect x=%271%27 y=%271%27 width=%276%27 height=%276%27 fill=%27%2326241c%27/%3E%3Crect x=%272%27 y=%272%27 width=%272%27 height=%272%27 fill=%27%23a3463c%27/%3E%3Crect x=%274%27 y=%274%27 width=%272%27 height=%272%27 fill=%27%23efecdf%27/%3E%3C/svg%3E">
<meta name="description" content="OUTIE：到现场打卡，收集宠物造型。">
<title>OUTIE — 到现场打卡，收集造型</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OUTIE">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
:root{
  --paper:#efecdf;--panel:#faf8ee;--ink:#26241c;--muted:#7c7867;--line:#c8c3ad;--faint:#e2ddc8;
  --blue:#41597e;--red:#a3463c;--yellow:#a8842e;--green:#4a6c46;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  color:var(--ink);background:var(--paper);
}
*{box-sizing:border-box}body{margin:0;min-width:300px;-webkit-font-smoothing:antialiased;background:var(--paper);background-image:repeating-conic-gradient(#26241c07 0% 25%,transparent 0% 50%);background-size:6px 6px}
button,input{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;border:0;line-height:1.3}button:disabled{cursor:default;opacity:.5}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}button:focus:not(:focus-visible){outline:none}
a{color:inherit}svg{display:block}h1,h2,h3,p{margin:0}::selection{background:var(--ink);color:var(--paper)}
[hidden]{display:none!important}.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.mono{letter-spacing:.08em}.eyebrow{font-size:10px;letter-spacing:.14em;font-weight:700}.muted{color:var(--muted)}
.icon{width:100%;height:100%;flex:none}
.shell{max-width:1184px;padding:0 28px;margin:0 auto}
.skip-link{position:fixed;top:-100px;left:18px;background:var(--ink);color:var(--paper);padding:12px;z-index:20}.skip-link:focus{top:12px}
.site-header{min-height:84px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:2px solid var(--ink);padding:10px 0}
.brand{display:flex;align-items:center;gap:14px;background:none;padding:0;text-align:left}
.brand svg{image-rendering:pixelated}
.brand-caption{border-left:2px solid var(--line);padding-left:13px;font-size:9px;line-height:1.6;letter-spacing:.14em;color:var(--muted)}
.desktop-nav{display:flex;gap:0;border:2px solid var(--ink);background:var(--panel)}
.nav-btn{background:none;padding:11px 22px;font-size:13px;font-weight:700;letter-spacing:.06em;border-right:2px solid var(--ink)}
.nav-btn:last-child{border-right:0}
.nav-btn[aria-current="page"]{background:var(--ink);color:var(--paper)}
.header-end{display:flex;align-items:center;gap:10px}
.demo-badge{font-size:9px;letter-spacing:.12em;border:2px solid var(--ink);padding:6px 9px;background:var(--panel);font-weight:700}
.icon-btn{min-width:42px;height:42px;border:2px solid var(--ink);background:var(--panel);font-size:10px;font-weight:700;letter-spacing:.1em;padding:0 10px}
.icon-btn:hover{background:var(--ink);color:var(--paper)}
.corner-badge{position:fixed;z-index:30;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font-size:9px;font-weight:700;letter-spacing:.14em;padding:6px 8px;font-family:inherit}
.corner-badge.dev{position:static;cursor:pointer}
.map-refresh{position:absolute;top:8px;right:8px;z-index:5;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font-weight:700;font-size:9px;letter-spacing:.1em;padding:5px 8px;cursor:pointer}
.map-refresh:hover{background:var(--ink);color:var(--paper)}
.header-end{display:flex;align-items:center;gap:8px}
.account-chip{display:flex;align-items:center;gap:7px;border:2px solid var(--ink);background:var(--panel);padding:3px 10px 3px 4px;font-weight:700;font-size:12px;letter-spacing:.02em}
.account-chip:hover{background:var(--ink);color:var(--paper)}
.account-chip img,.account-chip .avatar-fallback{width:26px;height:26px;border:2px solid var(--ink);object-fit:cover;display:block;background:var(--faint)}
.account-chip:hover img,.account-chip:hover .avatar-fallback{border-color:var(--paper)}
.btn-login-chip{border:2px solid var(--ink);background:var(--panel);font-weight:700;font-size:12px;padding:8px 14px;letter-spacing:.08em}
.btn-login-chip:hover{background:var(--ink);color:var(--paper)}
.auth-divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:10px;margin:14px 0}
.auth-divider:before,.auth-divider:after{content:"";flex:1;border-top:2px solid var(--faint)}
.corner-badge.offline{left:12px;bottom:12px;cursor:default}
.page-intro{display:flex;align-items:end;justify-content:space-between;gap:24px;margin:30px 0 22px}
.page-intro h1{font-size:27px;line-height:1.4;letter-spacing:-.01em;font-weight:700}
.intro-copy{font-size:13px;line-height:1.8;color:var(--muted);margin-top:8px}
.intro-mark{font-size:9px;letter-spacing:.14em;white-space:nowrap;border:2px solid var(--ink);padding:8px 10px;background:var(--panel);font-weight:700;margin-bottom:8px}
.main-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:24px;align-items:start}
.panel{background:var(--panel);border:2px solid var(--ink)}
.pet-card{background:var(--panel);border:2px solid var(--ink);padding:12px;position:relative}
.pet-topline{display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:.14em;padding:0 2px 10px;color:var(--muted)}
.pet-online{display:flex;gap:6px;align-items:center}
.live-dot{width:7px;height:7px;display:inline-block;background:var(--green)}
.pet-canvas{position:relative;border:2px solid var(--ink);height:365px;overflow:hidden;background-color:#ece8d6;background-image:linear-gradient(#26241c0d 1px,transparent 1px),linear-gradient(90deg,#26241c0d 1px,transparent 1px);background-size:22px 22px}
.pet-canvas.music{background-color:#e2e5ea}.pet-canvas.art{background-color:#ece2da}.pet-canvas.market{background-color:#eae4cc}
.pet-canvas.evolved{background-color:#2e2c25;background-image:linear-gradient(#ffffff14 1px,transparent 1px),linear-gradient(90deg,#ffffff14 1px,transparent 1px);color:var(--paper)}
.canvas-id{position:absolute;top:13px;left:14px;font-size:9px;letter-spacing:.14em;font-weight:700;z-index:1;background:var(--paper);border:2px solid var(--ink);padding:4px 7px;color:var(--ink)}
.pet-canvas.evolved .canvas-id{background:var(--paper)}
.deco{position:absolute;font-size:14px;font-weight:700;z-index:1;opacity:.5}
.deco.d1{left:22px;top:110px}.deco.d2{right:26px;top:170px}
.pet-touch{width:290px;height:280px;position:absolute;bottom:28px;left:50%;transform:translateX(-50%);background:none;padding:0;z-index:2}
.pet-touch svg{width:100%;height:100%;image-rendering:pixelated;animation:bob 1.4s steps(1,end) infinite}
.pet-touch.hop svg{animation:hop .5s steps(1,end) 1}
@keyframes bob{0%,49%{transform:translateY(0)}50%,100%{transform:translateY(-4px)}}
@keyframes hop{0%,24%{transform:translateY(0)}25%,49%{transform:translateY(-14px)}50%,74%{transform:translateY(0)}75%,100%{transform:translateY(-7px)}}
.ground{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);width:190px;height:10px;border-bottom:3px solid var(--ink);background:repeating-conic-gradient(#26241c30 0% 25%,transparent 0% 50%) 0 0/6px 6px}
.evolved .ground{border-bottom-color:#efecdf;background:repeating-conic-gradient(#efecdf40 0% 25%,transparent 0% 50%) 0 0/6px 6px}
.orbit-note{position:absolute;left:16px;bottom:16px;font-size:8px;letter-spacing:.16em;z-index:3;color:var(--muted)}
.evolved .orbit-note{color:#b9b4a0}
.screen-badge{position:absolute;right:16px;bottom:16px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:7px 9px;font-size:9px;letter-spacing:.14em;font-weight:700;z-index:3}
.screen-badge.hungry{background:var(--accent,#a3463c);color:#fcfaf0;animation:badge-blink 1.2s steps(2,end) infinite}
@keyframes badge-blink{50%{opacity:.55}}
/* 饿的分级动画：饱=弹跳 / 平常=呼吸 / 饿=垂头摇 / 濒饿=发抖 */
.pet-canvas.mood-full .pet-svg{animation:pet-bounce 1.4s steps(5,end) infinite}
.pet-canvas.mood-ok .pet-svg{animation:pet-idle 2.6s steps(6,end) infinite}
.pet-canvas.mood-hungry .pet-svg{animation:pet-slouch 2.8s steps(7,end) infinite;transform-origin:50% 100%}
.pet-canvas.mood-starving .pet-svg{animation:pet-tremble .45s steps(3,end) infinite}
@keyframes pet-idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes pet-bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}70%{transform:translateY(-2px)}}
@keyframes pet-slouch{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-4deg) translateY(1px)}}
@keyframes pet-tremble{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
@media (prefers-reduced-motion:reduce){.pet-canvas .pet-svg{animation:none!important}}
.pet-caption{display:flex;align-items:center;justify-content:space-between;padding:15px 2px 4px;gap:12px}
.pet-name{font-size:21px;font-weight:700;letter-spacing:.02em;overflow-wrap:anywhere}
.pet-caption .look-label{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:5px;letter-spacing:.06em}
.look-chip{display:flex;align-items:center;gap:5px;border:2px solid var(--line);padding:7px 9px;font-size:10px;white-space:nowrap;background:var(--paper)}
.hero-under{display:flex;justify-content:space-between;gap:10px;font-size:9px;letter-spacing:.12em;color:var(--muted);padding:13px 2px 0;font-weight:700}
.side-stack{display:flex;flex-direction:column;gap:18px}
.adopt-panel{padding:28px}
.adopt-panel .eyebrow{color:var(--muted);margin-bottom:16px}
.adopt-panel h2{font-size:30px;line-height:1.3;margin-bottom:14px;font-weight:700}
.adopt-panel p{font-size:13px;color:var(--muted);line-height:1.9}
.name-label{font-size:12px;font-weight:700;display:flex;justify-content:space-between;margin:22px 0 9px;align-items:center}
.name-label span{font-size:10px;font-weight:400;color:var(--muted)}
.name-input{width:100%;background:var(--paper);border:2px solid var(--line);padding:13px 14px;font-size:16px;font-weight:700;min-width:0}
.name-input:focus{border-color:var(--ink);outline:none;background:#fffef6}
.input-error{font-size:12px;line-height:1.5;color:#8c2f26;margin-top:7px;min-height:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:12px 18px;border:2px solid var(--ink);font-size:13px;font-weight:700;letter-spacing:.08em;background:var(--panel)}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-primary:hover{background:#000}
.btn-dark{background:var(--paper)}
.btn-dark:hover{background:var(--ink);color:var(--paper)}
.btn-quiet{border-color:var(--line);color:var(--muted)}
.btn-quiet:hover{border-color:var(--ink);color:var(--paper)}
a.btn{text-decoration:none}
.adopt-panel .btn{margin-top:15px}
.form-foot{display:flex;align-items:center;justify-content:center;gap:5px;font-size:10px;color:var(--muted);margin-top:12px}
.howto{padding:19px 21px}
.how-title{font-size:9px;letter-spacing:.16em;margin-bottom:15px;color:var(--muted);font-weight:700}
.steps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.step-num{font-size:10px;border:2px solid var(--ink);width:26px;height:26px;display:grid;place-items:center;background:var(--faint);margin-bottom:8px;font-weight:700}
.step strong{font-size:12px;display:block;margin-bottom:5px}
.step p{font-size:10px;color:var(--muted);line-height:1.6}
.goal-panel{padding:24px;background:var(--panel);position:relative}
.section-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.section-top h2{font-size:15px;font-weight:700}
.section-top .small-meta{font-size:10px;color:var(--muted)}
.goal-panel .eyebrow{color:var(--muted)}
.goal-panel h2{font-size:21px;line-height:1.5;margin:6px 0;letter-spacing:.01em}
.goal-panel .goal-copy{font-size:12px;line-height:1.8;color:var(--muted)}
.progress-row{display:flex;align-items:center;gap:12px;margin:20px 0 16px}
.stamp-track{display:flex;align-items:center;gap:8px;flex:1}
.stamp{width:40px;height:40px;display:grid;place-items:center;border:2px dashed var(--line);background:var(--paper);color:var(--line)}
.stamp .icon{width:20px;height:20px}
.stamp.done{border:2px solid var(--ink);background:var(--ink);color:var(--paper)}
.track-line{width:18px;height:3px;background:var(--line)}
.track-line.done{background:var(--ink)}
.count{display:flex;align-items:center}
.count svg{image-rendering:pixelated}
.goal-panel .btn{min-height:45px;font-size:12px}
.collection{padding:22px}
.looks-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
.look-option{padding:5px;background:var(--paper);min-width:0;text-align:center;border:2px solid var(--line)}
.look-thumb{aspect-ratio:1;position:relative;display:flex;align-items:center;justify-content:center;background:var(--faint);overflow:hidden}
.look-thumb.music{background:#e2e5ea}.look-thumb.art{background:#ece2da}.look-thumb.market{background:#eae4cc}.look-thumb.evolved{background:#dcd7c2}
.look-thumb svg{width:92%;height:92%;image-rendering:pixelated}
.look-option.locked svg{opacity:.3}
.look-option.locked .look-thumb{background:repeating-conic-gradient(#26241c10 0% 25%,transparent 0% 50%) 0 0/6px 6px,var(--faint)}
.look-option.active{border-color:var(--ink);background:#fffef6}
.look-option.active .look-thumb{border:2px solid var(--ink)}
.look-option:hover{border-color:var(--ink)}
.look-name{display:block;margin-top:7px;font-size:10px;white-space:nowrap}
.lock-pin{position:absolute;right:4px;bottom:4px;width:18px;height:18px;display:grid;place-items:center;background:var(--paper);border:2px solid var(--ink);color:var(--ink)}
.lock-pin .icon{width:10px;height:10px}
.wear-pin{position:absolute;right:4px;top:4px;width:18px;height:18px;display:grid;place-items:center;background:var(--ink);color:var(--paper)}
.wear-pin .icon{width:10px;height:10px}
.collection-note{font-size:10px;color:var(--muted);line-height:1.8;margin-top:14px}
.quiet-note{font-size:11px;line-height:1.9;color:var(--muted);padding:14px 16px;border:2px dashed var(--line);background:var(--paper)}
.footer{display:flex;justify-content:space-between;align-items:center;border-top:2px solid var(--ink);margin-top:30px;padding:18px 0 24px;gap:15px;font-size:9px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.storage-warning{background:var(--panel);border:2px solid #8c6a1f;color:#5d4512;padding:10px 12px;font-size:12px;line-height:1.6;margin-top:16px}
.activity-heading .back-link{background:var(--panel);border:2px solid var(--ink);padding:9px 13px;font-size:11px;font-weight:700;letter-spacing:.08em;white-space:nowrap}
.activity-heading .back-link:hover{background:var(--ink);color:var(--paper)}
.event-banner{border:2px solid var(--ink);background:var(--panel);margin-bottom:20px;position:relative;overflow:hidden}
.event-banner-main{padding:26px 28px;position:relative}
.event-tags{display:flex;gap:8px;align-items:center;font-size:9px;letter-spacing:.1em;margin-bottom:16px;font-weight:700}
.event-tag{border:2px solid var(--ink);padding:5px 8px;background:var(--paper)}
.event-wordmark-line{margin:4px 0 4px;overflow-x:auto}
.event-wordmark-line svg{image-rendering:pixelated;max-width:100%}
.event-sub{margin-top:12px;font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.event-banner-side{display:flex;align-items:center;justify-content:center;border-top:2px solid var(--ink);background:repeating-conic-gradient(#26241c12 0% 25%,transparent 0% 50%) 0 0/8px 8px;min-height:120px}
.ticket-box{border:2px solid var(--ink);background:var(--panel);padding:14px 22px;display:flex;flex-direction:column;align-items:center;gap:8px}
.ticket-box .count{min-height:30px}
.ticket-box span{font-size:9px;letter-spacing:.14em;font-weight:700;color:var(--muted)}
.demo-notice{font-size:11px;color:var(--muted);line-height:1.8;border:2px dashed var(--line);padding:10px 13px;margin-bottom:18px;background:var(--paper)}
.spots-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.spot-card{border:2px solid var(--ink);background:var(--panel);display:flex;flex-direction:column;scroll-margin-top:25px}
.spot-card.focus-spot{outline:4px solid var(--ink);outline-offset:2px}
.spot-art{height:160px;position:relative;overflow:hidden;border-bottom:2px solid var(--ink)}
.spot-art.music{background:#dde1e9}.spot-art.art{background:#e9dcd3}.spot-art.market{background:#e6dfc4}
.spot-number{position:absolute;left:12px;top:12px;font-size:9px;letter-spacing:.12em;font-weight:700;background:var(--paper);border:2px solid var(--ink);padding:4px 6px;z-index:2}
.spot-word{position:absolute;left:12px;top:44px;z-index:1;opacity:.9}
.spot-word svg{image-rendering:pixelated}
.spot-art .pet-svg{position:absolute;width:120px;height:120px;right:10px;bottom:14px;image-rendering:pixelated;z-index:1}
.dither-band{position:absolute;left:0;right:0;bottom:0;height:26px;border-top:2px solid var(--ink);background:repeating-conic-gradient(#26241c2e 0% 25%,transparent 0% 50%) 0 0/6px 6px;z-index:0}
.claimed-flag{position:absolute;right:10px;top:10px;display:flex;align-items:center;gap:5px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:5px 7px;font-size:9px;letter-spacing:.1em;font-weight:700;z-index:2}
.claimed-flag .icon{width:11px;height:11px}
.spot-body{padding:18px;display:flex;flex-direction:column;gap:0;flex:1}
.spot-headline{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-bottom:9px}
.spot-headline h2{font-size:17px;font-weight:700}
.spot-zone{font-size:9px;letter-spacing:.12em;color:var(--muted);font-weight:700;white-space:nowrap;border:2px solid var(--line);padding:4px 6px}
.spot-reward{font-size:12px;line-height:1.8;margin-bottom:15px}
.spot-reward span{color:var(--muted)}
.spot-body .btn{font-size:11px;min-height:43px;margin-top:auto}
.route-note{display:flex;align-items:center;gap:10px;justify-content:center;padding:19px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.route-note button{font-size:11px;text-decoration:underline;text-underline-offset:3px;background:none;padding:0;font-weight:700;color:var(--ink)}
/* ---- offline note ---- */
.offline-note{border:2px dashed var(--line);background:var(--paper);color:var(--muted);font-size:11px;letter-spacing:.08em;padding:10px 13px;margin:0 0 16px;line-height:1.8;font-weight:700}
/* ---- pixel city map (去哪儿) ---- */
.map-wrap{position:relative;border:2px solid var(--ink);background:#ece8d6;overflow:hidden;margin-bottom:20px}
.city-svg{width:100%;height:auto;display:block}
.map-tag{position:absolute;top:10px;left:10px;font-size:9px;letter-spacing:.14em;font-weight:700;background:var(--paper);border:2px solid var(--ink);padding:4px 7px;color:var(--ink);z-index:3}
.map-legend{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;gap:12px;border:2px solid var(--ink);background:var(--paper);padding:6px 9px;font-size:8px;letter-spacing:.1em;font-weight:700;color:var(--muted);z-index:3}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-swatch{width:9px;height:9px;border:2px solid var(--ink);background:var(--paper);flex:none}
.legend-swatch.done{background:var(--ink)}
.legend-swatch.here{border-color:var(--ink);background:var(--red);animation:blink 1.1s steps(1,end) infinite}
.map-marker{position:absolute;z-index:4;width:34px;height:34px;transform:translate(-50%,-50%);border:2px solid var(--ink);background:var(--paper);color:var(--ink);display:grid;place-items:center;padding:0}
.map-marker .icon{width:16px;height:16px}

function blankState(){return {version:1,name:'',createdAt:null,rewards:{},equipped:'base',evolved:false};}
function stateFromPet(p){
  const clean=blankState();
  clean.name=trimName(p&&p.name||'');
  clean.createdAt=typeof (p&&p.createdAt)==='string'?p.createdAt:null;
  const rewards=(p&&p.rewards)||{};
  if(SPOTS.length){
    for(const spot of SPOTS){if(typeof rewards[spot.id]==='string')clean.rewards[spot.id]=rewards[spot.id];}
  }else{
    /* 当前无进行中活动：不按点位过滤，保留宠物已有收集，避免活动下线后造型显示丢失 */
    for(const k of Object.keys(rewards)){if(typeof rewards[k]==='string')clean.rewards[k]=rewards[k];}
  }
  clean.evolved=Object.keys(clean.rewards).length===3&&p&&p.evolved===true;
  const allowed=['base',...Object.keys(clean.rewards),...(clean.evolved?['evolved']:[])];
  /* 往期活动的造型保持可穿戴（收藏馆） */
  for(const c of pastCollection){for(const s of c.spots){if(!allowed.includes(s.key))allowed.push(s.key);}}
  clean.equipped=allowed.includes(p&&p.equipped)?p.equipped:'base';
  return clean;
}
function loadState(){
  try{
    const testKey=STORAGE_KEY+'.probe';localStorage.setItem(testKey,'1');localStorage.removeItem(testKey);
    const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return blankState();
    const data=JSON.parse(raw);if(!data||data.version!==1||typeof data.name!=='string')return blankState();
    const clean=blankState();clean.name=trimName(data.name);clean.createdAt=typeof data.createdAt==='string'?data.createdAt:null;
    if(!clean.name)return clean;
    for(const spot of SPOTS){if(data.rewards&&typeof data.rewards[spot.id]==='string')clean.rewards[spot.id]=data.rewards[spot.id];}
    clean.evolved=Object.keys(clean.rewards).length===3&&data.evolved===true;
    const allowed=['base',...Object.keys(clean.rewards),...(clean.evolved?['evolved']:[])];
    clean.equipped=allowed.includes(data.equipped)?data.equipped:'base';return clean;
  }catch(error){
    try{const k=STORAGE_KEY+'.probe';localStorage.setItem(k,'1');localStorage.removeItem(k);}catch(e){storageOK=false;}
    return blankState();
  }
}

const ERR_SAFE_KEYS=['该地点不在打卡范围内','才能打卡','饲料不够','只有发布者','匿名打卡24小时后无法删除','每日最多只能上传','相距过远','无权删除这张照片','已被注册','密码至少','邮箱格式','用户名或密码错误','用户名和密码都是必需的','设备已注册','照片文件为空','照片数据校验失败','照片源文件已丢失','GitHub账号已绑定其他用户','未能获取你的位置','先领养一只宠物'];
function errText(error){
  const raw=error&&error.message?String(error.message):'';
  if(raw)console.warn('[outie api]',raw);
  if(error&&error.name==='AbortError')return '请求超时，请稍后重试';
  if(ERR_SAFE_KEYS.some(k=>raw.includes(k)))return raw;
  if(/定位|位置|坐标|高德/.test(raw))return '定位服务暂时不可用，请点地图右上角「刷新」重试';
  if(/photo|upload|照片/i.test(raw))return '照片服务暂时不可用，请稍后重试';
  if(/comment|评论/i.test(raw))return '评论暂时发不出去，请稍后重试';
  if(/token|身份|登录|user not found/i.test(raw))return '登录状态已过期，请重新登录';
  if(/github/i.test(raw))return 'GitHub 登录暂未开通，先用邮箱进入吧';
  return '操作失败，请稍后重试';
}
async function apiFetch(path,options={},timeoutMs=12000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs);
  try{
    const res=await fetch(API_BASE+path,{
      ...options,
      signal:controller.signal,
      headers:{...authHeaders(),...(options.headers||{})}
    });
    let data={};
    try{data=await res.json();}catch(e){}
    if(!res.ok){
      /* 悬空登录态自愈：token 无效或对应账号已不存在时清掉，立即匿名重试一次 */
      const dangling=res.status===401||(res.status===404&&/user not found/i.test(String(data.error||'')));
      if(dangling&&authToken()){
        try{localStorage.removeItem('outie.auth-token');}catch(e){}
        authUser=null;
        clearTimeout(timer);
        return apiFetch(path,options,timeoutMs);
      }
      const error=new Error(data.error||('请求失败（HTTP '+res.status+'）'));
      error.status=res.status;error.payload=data;throw error;
    }
    return data;
  }finally{clearTimeout(timer);}
}
async function probeApi(){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),10000);
  try{
    const res=await fetch(API_BASE+'/outie/event/current',{signal:controller.signal,headers:authHeaders()});
    clearTimeout(timer);
    if(!res.ok)return null;
    const data=await res.json();
    if(!data)return null;
    const event=(data.event&&Array.isArray(data.event.spots)&&data.event.spots.length)?data.event:null;
    return {event,devSkipGeo:Boolean(data.devSkipGeo)};
  }catch(error){
    clearTimeout(timer);
    return null;
  }
}

async function checkinApi(spotId){
  const prevEvolved=state.evolved;
  const doPost=coords=>apiFetch('/outie/checkin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(coords?{spotKey:spotId,...coords}:{spotKey:spotId})});
  const handle=data=>{
    pet=data.pet;state=stateFromPet(pet);render();
    if(data.alreadyOwned){showLook(spotId);toast('该站已领取过。');return;}
    if(data.newlyEvolved&&!prevEvolved)pendingEvolution=true;
    if(data.tokenBonus)toast(`获赠 ${data.tokenBonus} 包饲料！`);
    showReward(spotId);confetti();
  };
  if(devSkipGeo){
    try{handle(await doPost(null));}catch(error){toast(errText(error));}
    return;
  }
  if(!navigator.geolocation){toast('此浏览器不支持定位，无法打卡。');return;}
  toast('正在获取定位…');
  navigator.geolocation.getCurrentPosition(async position=>{
    try{
      handle(await doPost({userLng:position.coords.longitude,userLat:position.coords.latitude}));
    }catch(error){toast(errText(error));}
  },error=>{toast('获取定位失败：'+(error.message||'请检查定位权限'));},{enableHighAccuracy:true,timeout:9000,maximumAge:15000});
}

function pixText(text,size=2,color='currentColor'){
  const s=size;let x=0;const parts=[];
  for(const ch of String(text)){
    if(ch===' '){x+=2;continue;}
    const g=FONT[ch.toUpperCase()];if(!g){x+=3;continue;}
    const rows=g.split(','),w=rows[0].length;
    rows.forEach((row,ry)=>{let rx=0;while(rx<w){if(row[rx]==='1'){let run=1;while(rx+run<w&&row[rx+run]==='1')run++;parts.push(`<rect x="${(x+rx)*s}" y="${ry*s}" width="${run*s}" height="${s}" fill="${color}"/>`);rx+=run;}else rx++;}});
    x+=w+1;
  }
  const W=Math.max(1,(x-1)*s),H=5*s;
  return `<svg class="pixtext" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true" style="image-rendering:pixelated">${parts.join('')}</svg>`;
}

function shadeHex(hex,p){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  const t=p<0?0:255,a=Math.abs(p)/100;
  r=Math.round(r+(t-r)*a);g=Math.round(g+(t-g)*a);b=Math.round(b+(t-b)*a);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
const ACC_ROWS={headphones:'music',glasses:'art',bag:'market',crown:'evolved',bow:'bow',scarf:'scarf',cap:'cap',flower:'flower',bell:'bell'};
const SPOT_CELLS=[[6,6],[15,6],[11,8],[5,11],[16,11],[9,13],[12,13]];
function applyPattern(grid,pattern){
  if(pattern==='spots'){for(const[x,y]of SPOT_CELLS){if(grid[y]&&grid[y][x]==='F')grid[y][x]='B';}}
  else if(pattern==='stripes'){for(const y of[11,13]){if(!grid[y])continue;for(let x=0;x<grid[y].length;x++){if(grid[y][x]==='F')grid[y][x]='B';}}}
  return grid;
}
function petSVG(variant='base',spec){
  const id='px'+(++svgId);
  let acc,acc2,over,bodyFill='#fcfaf0',base=PET_BASE_BLOB,pattern='solid';
  if(spec&&spec.body){
    acc=spec.accent||'#41597e';
    acc2=shadeHex(acc,35);
    base=PET_BASES[spec.shape]||PET_BASE_BLOB;
    pattern=spec.pattern||'solid';
    over=(spec.accessory&&spec.accessory!=='none'&&PET_OVER[ACC_ROWS[spec.accessory]])||null;
    bodyFill=shadeHex(spec.body,74);
  }else{
    acc=ACC[variant]||ACC.base;acc2=ACC2[variant]||ACC2.base;over=PET_OVER[variant]||null;
  }
  const h=base.length,w=base[0].length;
  const grid=base.map(row=>row.split(''));
  if(pattern!=='solid')applyPattern(grid,pattern);
  if(over){for(let y=0;y<over.length&&y<h;y++){const row=over[y];if(!row)continue;for(let x=0;x<row.length&&x<w;x++){if(row[x])grid[y][x]=row[x];}}}
  const uses={S:false,h:false,L:false};
  const rects=[];
  for(let y=0;y<h;y++){
    let x=0;
    while(x<w){
      const c=grid[y][x];
      if(c==='.'){x++;continue;}
      if(c==='S'||c==='h'||c==='L'){uses[c]=true;rects.push(`<rect x="${x}" y="${y}" width="1" height="1" fill="url(#${id}${c})"/>`);x++;continue;}
      let run=1;while(x+run<w&&grid[y][x+run]===c)run++;
      const fill=c==='F'?bodyFill:(c==='A'?acc:(c==='B'?acc2:'#26241c'));
      rects.push(`<rect x="${x}" y="${y}" width="${run}" height="1" fill="${fill}"/>`);
      x+=run;
    }
  }
  const defs=[];
  const dither=(pid,color)=>`<pattern id="${pid}" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="transparent"/><rect width="1" height="1" fill="${color}"/><rect x="1" y="1" width="1" height="1" fill="${color}"/></pattern>`;
  if(uses.S)defs.push(dither(id+'S','#26241c59'));
  if(uses.h)defs.push(dither(id+'h',acc+'66'));
  if(uses.L)defs.push(dither(id+'L','#41597e4d'));
  return `<svg class="pet-svg" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" aria-hidden="true">${defs.length?`<defs>${defs.join('')}</defs>`:''}${rects.join('')}</svg>`;
}
function petSVGForCanvas(variant){
  const lk=lookFor(variant)||{};
  const raw=petSVG(variant,lk.spec);
  const match=raw.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/);
  const w=match?Math.round(parseFloat(match[1])*10):220;
  const h=match?Math.round(parseFloat(match[2])*10):160;
  return raw.replace('<svg ',`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" `);
}

function pixIcon(name){
  const g=ICONS[name]||ICONS.star,w=g[0].length,h=g.length,parts=[];
  g.forEach((row,y)=>{let x=0;while(x<w){if(row[x]==='1'){let run=1;while(x+run<w&&row[x+run]==='1')run++;parts.push(`<rect x="${x}" y="${y}" width="${run}" height="1"/>`);x+=run;}else x++;}});
  return `<svg class="icon" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true">${parts.join('')}</svg>`;
}
function qrSVG(){
  const n=13,parts=[];let seed=7;
  const rnd=()=>{seed=(seed*1103515245+12345)>>>0;return seed/4294967296;};
  const finder=(x,y)=>{
    parts.push(`<rect x="${x}" y="${y}" width="5" height="1"/><rect x="${x}" y="${y+4}" width="5" height="1"/><rect x="${x}" y="${y}" width="1" height="5"/><rect x="${x+4}" y="${y}" width="1" height="5"/><rect x="${x+1}" y="${y+1}" width="3" height="3"/>`);
  };
  const inFinder=(x,y)=>(x<6&&y<6)||(x>n-7&&y<6)||(x<6&&y>n-7);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(!inFinder(x,y)&&rnd()<0.44)parts.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`);}
  finder(0,0);finder(n-5,0);finder(0,n-5);
  return `<svg class="qr" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true">${parts.join('')}</svg>`;
}

let postingPhoto=false,postPresetEvent=null,postNearEvents=null,photoInput=null,eventDetailCache={};
function compressImage(file,maxSide){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      try{
        const scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
        const w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const g=c.getContext('2d');g.drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg',0.85));
      }catch(e){URL.revokeObjectURL(url);reject(e);}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('照片读取失败'));};
    img.src=url;
  });
}
/* dataURL 转 Blob：CSP 的 connect-src 不含 data:，fetch(data:) 在生产会被拦，必须本地解码 */
function dataUrlToBlob(dataUrl){
  const[meta,b64]=String(dataUrl).split(',');
  const mime=(String(meta).match(/^data:([^;]+)/)||[])[1]||'image/jpeg';
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new Blob([bytes],{type:mime});
}
function postEventById(key){
  for(const list of [postNearEvents,nearEvents]){
    if(Array.isArray(list)){const hit=list.find(x=>x.key===key);if(hit)return hit;}
  }
  if(eventDetailCache[key])return eventDetailCache[key];
  return null;
}
function startPhotoPost(presetEvent){
  if(mode!=='api'){toast('离线模式，连上后可发照片。');return;}
  postPresetEvent=presetEvent?{key:String(presetEvent.key||presetEvent),name:String(presetEvent.name||'')}:(presetEvent&&typeof presetEvent==='object'?presetEvent:null);
  if(photoInput){photoInput.remove();photoInput=null;}
  const input=document.createElement('input');
  input.type='file';
  input.accept='image/*';
  input.setAttribute('capture','environment');
  input.style.display='none';
  input.addEventListener('change',async ()=>{
    photoInput=null;
    const file=input.files&&input.files[0];
    input.remove();
    if(!file)return;
    try{
      toast('正在处理照片…');
      const dataUrl=await compressImage(file,1600);
      openPhotoPostModal(dataUrl);

}
/* 坐标决策：真实定位优先；勾选/预设了活动则可用活动中心；否则不可发布 */
async function resolvePostCoords(){
  if(geo.state==='ok'&&geo.coords)return {coords:geo.coords,real:true};
  const evtCb=document.querySelector('.post-evt:checked');
  const key=postPresetEvent?postPresetEvent.key:(evtCb?evtCb.value:null);
  if(key){
    const e=postEventById(key);
    if(e&&e.center)return {coords:e.center,real:false,eventKey:key};
  }
  // GPS 不可用：服务端 IP 定位（OurVerse 同款，城市级真实推断）
  try{
    const data=await apiFetch('/location/ip');
    const loc=data&&data.location;
    if(loc&&Number.isFinite(loc.lat)&&Number.isFinite(loc.lng)){
      return {coords:{lng:loc.lng,lat:loc.lat},real:false,ip:true};
    }
  }catch(e){}
  return {error:true};
}

    +'<p class="about-list mono" id="post-loc-note">'+(hasLoc?'定位：你当前的位置':'定位：将通过 IP 推断（城市级）')+'</p>'

      try{

        const loc=data&&data.location;
        if(loc&&Number.isFinite(loc.lat)&&Number.isFinite(loc.lng)){lat=loc.lat;lng=loc.lng;}
      }catch(e){}
    }
    if(lat===null){box.innerHTML='<p class="about-list mono">暂时无法定位：照片将不带位置发布。</p>';return;}
    try{

        :'<p class="about-list mono">附近没有进行中的活动：照片不会归入活动。</p>';
    }catch(e){box.innerHTML='<p class="about-list mono">附近活动查询失败：照片不会归入活动。</p>';}

async function publishPhotoPost(){
  if(postingPhoto)return;
  const dataUrl=document.getElementById('post-preview')?.getAttribute('src');
  const caption=document.getElementById('post-caption').value.trim();
  if(!dataUrl)return;
  postingPhoto=true;
  const submitBtn=document.querySelector('#photo-post-form button[type="submit"]');
  const closeBtn=dialog.querySelector('.modal-close');
  const errEl=document.getElementById('post-error');
  if(submitBtn){submitBtn.disabled=true;submitBtn.textContent='发布中…';}
  if(closeBtn)closeBtn.disabled=true;
  if(errEl)errEl.textContent='';
  try{
    const decision=await resolvePostCoords();
    if(decision.error){
      postingPhoto=false;
      if(submitBtn){submitBtn.disabled=false;submitBtn.textContent='发到现场';}
      if(closeBtn)closeBtn.disabled=false;
      if(errEl)errEl.textContent='定位服务暂不可用：请点地图右上角「刷新」重试。';
      return;
    }
    const blob=dataUrlToBlob(dataUrl);
    const c=decision.coords;
    const evtCb=document.querySelector('.post-evt:checked');
    const eventKey=postPresetEvent?postPresetEvent.key:(evtCb?evtCb.value:'');
    const form=new FormData();
    form.append('photo',blob,'outie-photo.jpg');
    if(caption)form.append('caption',caption);
    if(eventKey)form.append('eventKey',eventKey);
    form.append('userLat',String(c.lat));
    form.append('userLng',String(c.lng));
    form.append('locationSource',decision.real?'gps':'ip');
    await apiFetch('/photos/anonymous',{method:'POST',body:form},60000);
    postingPhoto=false;
    nearPhotos=null;nearStatus='idle';minePhotos=null;mineStatus='idle';mineAlbumIdx=null;
    nearEvents=null;nearEventsStatus='idle';
    if(decision.ip){geo.coords=decision.coords;geo.state='ok';geo.via='ip';}
    closeModal();
    navigate('explore');
    loadNearStream(true);loadNearEvents(true);
    toast((decision.ip?'已发到现场（使用 IP 定位）。':decision.real?'已发到现场。':'已发到现场，并归入活动。'));
  }catch(error){
    postingPhoto=false;
    if(submitBtn){submitBtn.disabled=false;submitBtn.textContent='发到现场';}
    if(closeBtn)closeBtn.disabled=false;
    if(errEl)errEl.textContent='发布失败：'+errText(error);
  }
}

/* ---------- 步数换饲料：页面内实时计步（iOS 需手势授权动作传感器） ---------- */
function todayKey(){const d=new Date(Date.now()+8*3600000);return d.toISOString().slice(0,10);}
let stepBuf={day:'',count:0,synced:0};
let pedometerState='off';
let motionAvg=9.8,motionLast=0;
function stepsLoad(){
  try{
    const raw=JSON.parse(localStorage.getItem('outie.steps')||'{}');
    if(raw&&raw.day===todayKey())stepBuf=raw;
    else stepBuf={day:todayKey(),count:0,synced:0};
  }catch(e){stepBuf={day:todayKey(),count:0,synced:0};}
  try{pedometerState=localStorage.getItem('outie.pedometer')==='on'?'on':(localStorage.getItem('outie.pedometer')||'off');}catch(e){}
}
function stepsSave(){try{localStorage.setItem('outie.steps',JSON.stringify(stepBuf));}catch(e){}}
function onMotion(e){
  const a=e.accelerationIncludingGravity;
  if(!a||a.x==null)return;
  const mag=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z);
  motionAvg=motionAvg*0.8+mag*0.2;
  const now=Date.now();
  if(mag-motionAvg>1.2&&now-motionLast>280){motionLast=now;addLocalSteps(1);}
}
function addLocalSteps(n){
  stepsLoad();
  if(stepBuf.day!==todayKey())stepBuf={day:todayKey(),count:0,synced:0};
  stepBuf.count+=n;stepsSave();
  if(view==='pet'&&document.querySelector('.feed-panel'))renderFeedPanelLive();
  if(stepBuf.count-stepBuf.synced>=25)syncSteps();
}
let syncingSteps=false;
async function syncSteps(){
  const delta=stepBuf.count-stepBuf.synced;
  if(delta<=0||mode!=='api'||syncingSteps)return;
  syncingSteps=true;
  try{
    const data=await apiFetch('/outie/steps/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({steps:delta})});
    stepBuf.synced=stepBuf.count;stepsSave();
    if(pet){pet.feedTokens=data.feedTokens;pet.stepsToday=data.stepsToday;}
    if(view==='pet')render();
  }catch(e){/* 静默：本地步数留着，下轮再同步 */}
  syncingSteps=false;
}
function enablePedometer(){
  const D=window.DeviceMotionEvent;
  if(!D){pedometerState='unsupported';render();toast('这台设备不支持计步，用打卡赚不了饲料但还能正常喂。');return;}
  const start=()=>{
    window.addEventListener('devicemotion',onMotion);
    pedometerState='on';
    try{localStorage.setItem('outie.pedometer','on');}catch(e){}
    render();toast('计步已开启：带着手机走路就有饲料。');
  };
  if(typeof D.requestPermission==='function'){

function wgs84togcj02(lng,lat){
  if(lng<72.004||lng>137.8347||lat<0.8293||lat>55.8271)return {lng,lat};
  const a=6378245,ee=0.00669342162296594323;
  const tLat=x=>-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x))+(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3+(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3+(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;
  const tLng=x=>300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x))+(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3+(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3+(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;
  let dLat=tLat(lng-105,lat-35),dLng=tLng(lng-105,lat-35);
  const radLat=lat/180*Math.PI;let magic=Math.sin(radLat);magic=1-ee*magic*magic;
  const sqrtMagic=Math.sqrt(magic);
  dLat=(dLat*180)/((a*(1-ee))/(magic*sqrtMagic)*Math.PI);
  dLng=(dLng*180)/(a/sqrtMagic*Math.cos(radLat)*Math.PI);
  return {lng:lng+dLng,lat:lat+dLat};
}

/* 定位：与旧官网一致 —— AMap.Geolocation（convert:true 自动 GCJ 转换，SDK 内置精度回退） */
function locateWithAmap(){
  return loadAmap().then(AMap=>new Promise((resolve,reject)=>{
    AMap.plugin('AMap.Geolocation',()=>{
      const geolocation=new AMap.Geolocation({
        enableHighAccuracy:true,
        timeout:10000,
        convert:true,
        showCircle:false,
        showButton:false,
        positionAccuracy:'high'
      });
      geolocation.getCurrentPosition((status,result)=>{
        if(status==='complete'&&result&&result.position){
          const lng=typeof result.position.getLng==='function'?result.position.getLng():result.position.lng;
          const lat=typeof result.position.getLat==='function'?result.position.getLat():result.position.lat;
          if(Number.isFinite(lng)&&Number.isFinite(lat)){
            resolve({lng,lat,accuracy:Number(result.accuracy)||0});
            return;
          }
        }
        reject(new Error('定位失败'));
      });
    });
  })).catch(()=>{
    // AMap 脚本不可用时的最后手段：浏览器定位（两段精度）
    const ask=(high,ms)=>new Promise((resolve,reject)=>{
      if(!navigator.geolocation)return reject(new Error('浏览器不支持定位'));
      navigator.geolocation.getCurrentPosition(
        pos=>{const g=wgs84togcj02(pos.coords.longitude,pos.coords.latitude);resolve({lng:g.lng,lat:g.lat,accuracy:pos.coords.accuracy||0});},
        err=>reject(new Error(err&&err.code===1?'PERMISSION_DENIED':'定位失败')),
        {enableHighAccuracy:high,timeout:ms,maximumAge:30000}
      );
    });
    return ask(true,8000).catch(e=>String(e.message).includes('PERMISSION_DENIED')?Promise.reject(e):ask(false,8000));
  });
}

function fitZoomKm(container,lat,radiusMeters){
  const rect=container.getBoundingClientRect();
  const px=Math.max(200,Math.min(rect.width||340,rect.height||340));
  const mpp=156543.03392*Math.cos((lat||31)*Math.PI/180)/Math.pow(2,16);
  let z=16+Math.log2((mpp*px)/(radiusMeters*2));
  return Math.min(18,Math.max(10,Number.isFinite(z)?z:15));

function haversineMeters(a,b){
  const R=6371000,toRad=d=>d*Math.PI/180;
  const dLat=toRad(b.lat-a.lat),dLng=toRad(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function nearestSpot(coords){
  let best=null,bestD=Infinity;
  for(const s of spotsWithCoords()){
    const d=haversineMeters(coords,{lng:s.lng,lat:s.lat});
    if(d<bestD){bestD=d;best=s;}
  }

    let target=null;

function renderMapMarkers(){
  if(!realMap)return;
  for(const m of mapMarkers){try{m.setMap(null);}catch(e){}try{m.remove&&m.remove();}catch(e){}try{m.el&&m.el.remove();}catch(e){}}
  mapMarkers=[];
  const addNative=(position,el,anchor,zIndex)=>{
    mapMarkers.push(mapEngine().addEl(realMap,position.lng??position[0],position.lat??position[1],el,anchor,zIndex));
  };
  const addManual=(lng,lat,el,via)=>{
    // 锁定地图：手动投影定位最可靠（原生 Marker 对部分元素不排版）
    el.style.position='absolute';
    el.style.transform=via==='center'?'translate(-50%,-50%)':'translate(-50%,-100%)';
    const holder=document.getElementById('map-canvas');
    let p=null;
    try{p=realMap.project?realMap.project([lng,lat]):(realMap.lngLatToContainer?realMap.lngLatToContainer([lng,lat]):null);}catch(e){}
    if(p&&Number.isFinite(p.x)&&Number.isFinite(p.y)){
      el.style.left=p.x+'px';
      el.style.top=p.y+'px';
      holder.appendChild(el);
      mapMarkers.push({el,remove(){el.remove();},setMap(){el.remove();}});
    }
  };
  if(eventData){
    for(const s of SPOTS){
      if(!Number.isFinite(s.lng)||!Number.isFinite(s.lat))continue;
      addNative([s.lng,s.lat],mapMarkerButton(s),'center',120);
    }
  }
  if(Array.isArray(nearEvents)){
    for(const e of nearEvents){
      const c=e.center;if(!c||!Number.isFinite(c.lng)||!Number.isFinite(c.lat))continue;
      const pin=document.createElement('button');
      pin.type='button';
      pin.className='event-pin mono';
      pin.dataset.action='event-open';
      pin.dataset.event=String(e.key||'');
      pin.title=e.name;
      pin.innerHTML=`<span class="event-pin-ic">${pixIcon('flag')}</span>`;
      addManual(c.lng,c.lat,pin,'bottom');
    }
  }
  const clusters=clusterNearPhotos();
  clusters.forEach((c,ci)=>{
    const first=c.items[0];
    const pin=document.createElement('button');
    pin.type='button';
    pin.className='photo-pin';
    pin.dataset.action='cluster-open';
    pin.dataset.cluster=String(ci);
    pin.title=(c.items.length>1?c.items.length+' 张照片 · ':'')+(first.caption||'现场照片');
    pin.innerHTML=`<img src="${esc(photoAbsUrl(first.url))}" alt="">${c.items.length>1?`<span class="pin-count mono">${c.items.length}</span>`:''}`;
    addManual(c.lng,c.lat,pin,'bottom');
  });
  if(geo.state==='ok'&&geo.coords){
    addManual(geo.coords.lng,geo.coords.lat,youDotElement(),'center');
  }
  if(realMap)mapEngine().nudge(realMap);
}

function fmtClock(iso){

function albumNameForEvent(eventKey){
  for(const list of [myEvents,nearEvents]){
    if(!Array.isArray(list))continue;
    const hit=list.find(e=>e.key===eventKey);
    if(hit)return hit.name;
  }
  return '活动相册';
}
function groupMinePhotos(photos){
  const albums=[];
  for(const p of (Array.isArray(photos)?photos:[])){
    if(p.eventKey){
      let a=albums.find(x=>x.key==='evt:'+p.eventKey);
      if(!a){a={key:'evt:'+p.eventKey,name:albumNameForEvent(p.eventKey),cover:p,items:[]};albums.push(a);}
      a.items.push(p);
      continue;
    }
    if(!Number.isFinite(p.lat)||!Number.isFinite(p.lng)){
      let g=albums.find(x=>x.key==='other');
      if(!g){g={key:'other',name:'其他',cover:p,items:[]};albums.push(g);}
      g.items.push(p);
      continue;
    }
    let a=null;
    for(const x of albums){
      if(x.key.startsWith('geo:')&&haversineMeters({lat:x.lat,lng:x.lng},{lat:p.lat,lng:p.lng})<=45){a=x;break;}
    }
    if(!a){a={key:'geo:'+albums.length,lat:p.lat,lng:p.lng,name:(String(p.caption||'').trim()||'现场').slice(0,12),cover:p,items:[]};albums.push(a);}
    a.items.push(p);
  }
  return albums;
}

async function submitWorkbench(){
  if(wbBusy)return;
  const name=document.getElementById('wb-name').value.trim();
  if(!name){toast('先给活动起个名字。');return;}
  const subtitle=document.getElementById('wb-subtitle').value.trim();
  const active=document.getElementById('wb-active').checked;
  /* 坐标解析：锁定的用锁定值；未锁定的用当前定位；拿不到真实定位就明确拒绝，绝不造假坐标 */
  const located=geo.state==='ok'&&geo.coords;
  const spotsPayload=[];
  for(let i=0;i<ensureWbSpots().length;i++){
    const sp=wbSpots[i];
    const lng=sp.setAt?sp.lng:(located?Number(geo.coords.lng.toFixed(6)):null);
    const lat=sp.setAt?sp.lat:(located?Number(geo.coords.lat.toFixed(6)):null);
    if(!Number.isFinite(lng)||!Number.isFinite(lat)){
      wbBusy=false;
      toast('点位'+(i+1)+'还没有定位：走到点位旁点「用我的位置」。');
      return;
    }
    spotsPayload.push({
      name:sp.name,zone:sp.zone,rewardName:sp.rewardName,arrivalNote:sp.arrivalNote,
      lng,lat,
      look:{name:sp.rewardName||sp.name,shape:sp.shape,body:sp.body,accent:sp.accent,pattern:sp.pattern||'solid',accessory:sp.accessory}
    });
  }
  const payload={name,subtitle,active,spots:spotsPayload};
  wbBusy=true;
  try{
    await apiFetch('/outie/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    wbBusy=false;wbSpots=null;myEvents=null;myEventsStatus='idle';
    toast('活动已发布'+(active?'并上架。':'（未上架）。'));
    render();
    const wrap=document.getElementById('wb-my-events');
    if(wrap)loadMyEventsList();
  }catch(error){wbBusy=false;toast('发布失败：'+errText(error));}
}

let audioCtx=null;
function blip(kind){
  try{
    if(localStorage.getItem('outie.mute')==='1'||reduceMotion.matches)return;
    audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const seq={feed:[[660,.07],[880,.11]],checkin:[[523,.07],[659,.07],[784,.13]],evolve:[[523,.07],[659,.07],[784,.07],[1046,.18]]}[kind];
    if(!seq)return;
    let t=audioCtx.currentTime+.01;
    for(const[f,d]of seq){
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='square';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.045,t+.012);
      g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g);g.connect(audioCtx.destination);
      o.start(t);o.stop(t+d+.02);
      t+=d;
    }
  }catch(e){}
}

    case 'evolve-prompt':showEvolutionPrompt();break;
    case 'evolve':evolve();break;
    case 'reset-prompt':resetPrompt();break;
    case 'reset-confirm':reset();break;
    case 'pet':{
      button.classList.remove('hop');void button.offsetWidth;button.classList.add('hop');break;
    }
  }
}
document.addEventListener('input',event=>{
  const el=event.target;
  if(el.classList&&el.classList.contains('wb-in')){
    const i=Number(el.dataset.idx),f=el.dataset.f;
    if(Number.isFinite(i)&&f&&wbSpots&&wbSpots[i]){
      wbSpots[i][f]=f==='lng'||f==='lat'?Number(el.value):el.value;
      const prev=document.querySelector(`[data-prev="${i}"]`);
      if(prev&&f!=='lng'&&f!=='lat'&&f!=='name'&&f!=='arrivalNote')prev.innerHTML=petSVG('wb'+i,wbSpec(wbSpots[i]));
    }
    return;
  }
});
document.addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(button&&!button.disabled)handleAction(button);});
document.addEventListener('submit',async event=>{
  if(event.target.id==='adopt-form'){
    event.preventDefault();const input=document.getElementById('pet-name');const name=trimName(input.value);
    if(!name){document.getElementById('name-error').textContent='先起一个名字。';input.focus();return;}
    const submitButton=document.getElementById('adopt-button');submitButton.disabled=true;
    if(mode==='api'){
      try{
        await adoptApi(name);flashNext=true;navigate('pet');toast(name+' 已加入。');
      }catch(error){
        document.getElementById('name-error').textContent=errText(error);
      }
      submitButton.disabled=false;return;
    }
    state={...blankState(),name,createdAt:new Date().toISOString()};save();flashNext=true;navigate('pet');toast(name+' 已加入。');
  }
  if(event.target.id==='wb-form'){
    event.preventDefault();
    submitWorkbench();
    return;
  }
  if(event.target.id==='photo-post-form'){
    event.preventDefault();
    publishPhotoPost();
    return;
  }
  if(event.target.id==='comment-form'){
    event.preventDefault();
    const input=document.getElementById('comment-input');
    const submitBtn=event.target.querySelector('button[type="submit"]');
    const text=(input.value||'').trim();
    if(!text||!currentDetailId)return;
    if(submitBtn)submitBtn.disabled=true;
    try{
      await apiFetch(`/photos/${currentDetailId}/comments`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({comment:text})});
      input.value='';
      await loadPhotoComments(currentDetailId);
      const list=document.getElementById('comment-list');
      if(list)list.scrollTop=list.scrollHeight;
      toast('评论已发送。');
    }catch(error){toast(errText(error));}
    if(submitBtn)submitBtn.disabled=false;
    return;
  }
  if(event.target.id==='login-form'){
    event.preventDefault();
    const username=document.getElementById('login-username').value.trim();
    const password=document.getElementById('login-password').value;
    const emailEl=document.getElementById('login-email');
    const email=emailEl?emailEl.value.trim():'';
    const errEl=document.getElementById('login-error');
    if(!username||!password){errEl.textContent='用户名和密码都要填。';return;}
    if(authMode==='register'&&password.length<6){errEl.textContent='密码至少 6 位。';return;}
    errEl.textContent='';
    const submitBtn=event.target.querySelector('button[type="submit"]');
    if(submitBtn)submitBtn.disabled=true;
    try{
      const payload=authMode==='register'
        ?{username,password,email:email||undefined}
        :{username,password,deviceId:identityId()};
      const data=await apiFetch('/auth/'+authMode,{method:'POST',headers:{'Content-Type':'application/json','X-Device-Id':identityId()},body:JSON.stringify(payload)});
      try{localStorage.setItem('outie.auth-token',data.token);}catch(e){}
      authUser=data.user||null;
      await refreshAuthState();closeModal();render();toast(authMode==='register'?'注册成功，已登录。':'登录成功，进度已同步。');
    }catch(error){
      errEl.textContent=errText(error);
      if(submitBtn)submitBtn.disabled=false;
    }
    return;
  }
  if(event.target.id==='rename-form'){
    event.preventDefault();const input=document.getElementById('rename-input');const name=trimName(input.value);
    if(!name){document.getElementById('rename-error').textContent='名字不能为空。';input.focus();return;}
    if(mode==='api'){
      try{
        const data=await apiFetch('/outie/pet',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
        pet=data.pet;state=stateFromPet(pet);closeModal();render();toast('名字已保存。');
      }catch(error){
        document.getElementById('rename-error').textContent=errText(error);
      }
      return;
    }
    state.name=name;save();closeModal();render();toast('名字已保存。');
  }
});
dialog.addEventListener('click',event=>{if(postingPhoto)return;if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeModal();}});
dialog.addEventListener('cancel',event=>{if(postingPhoto){event.preventDefault();return;}event.preventDefault();closeModal();});
window.addEventListener('resize',()=>{if(view==='explore'&&realMap)engine_resizeSafe();});
window.addEventListener('hashchange',()=>{if(!state.name)return;closeModal();view=viewFromHash();render();});
window.addEventListener('storage',event=>{if(mode==='offline'&&event.key===STORAGE_KEY){state=loadState();closeModal();render();}});
function captureAuthFromUrl(){
  try{
    const url=new URL(location.href);
    const token=url.searchParams.get('token');
    const error=url.searchParams.get('error');
    if(!token&&error===null)return;
    if(token)localStorage.setItem('outie.auth-token',token);
    url.searchParams.delete('token');url.searchParams.delete('error');
    history.replaceState(null,'',url.pathname+(url.searchParams.toString()?'?'+url.searchParams:'')+url.hash);
    if(token)toast('GitHub 登录成功。');
    if(error)toast('登录没有完成，请重试。');
  }catch(e){}
}
async function boot(){
  captureAuthFromUrl();
  const probe=await probeApi();
  if(probe){
    mode='api';
    devSkipGeo=Boolean(probe.devSkipGeo);
    if(probe.event){applyEvent(probe.event);}
    else{eventData=null;SPOTS=[];rebuildLooks();}
    await refreshAuthState();
  }else{
    mode='offline';
    SPOTS=OFFLINE_SPOTS;
    rebuildLooks();
    state=loadState();
    document.getElementById('offline-badge').hidden=false;
    scheduleReconnect();
  }
  document.getElementById('dev-badge').hidden=!devSkipGeo;
  document.getElementById('offline-badge').hidden=(mode!=='offline');
  document.getElementById('storage-warning').hidden=storageOK;
  render();
}
let reconnectTimer=null;
function scheduleReconnect(){
  if(reconnectTimer||mode!=='offline')return;
  reconnectTimer=setInterval(async()=>{
    if(await probeApi()){clearInterval(reconnectTimer);reconnectTimer=null;boot();}
  },15000);
}
async function tryReconnect(){
  if(mode!=='offline')return;
  if(await probeApi()){if(reconnectTimer){clearInterval(reconnectTimer);reconnectTimer=null;}boot();}
  else toast('还是连不上，稍后再试。');
}
document.getElementById('wordmark').innerHTML=pixText('OUTIE',4);
/* 步数计步：恢复今日进度；之前授权过就静默继续 */
stepsLoad();
if(pedometerState==='on'&&window.DeviceMotionEvent&&typeof window.DeviceMotionEvent.requestPermission!=='function'){
  window.addEventListener('devicemotion',onMotion);
}
setInterval(()=>{stepsLoad();syncSteps();},30000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)syncSteps();});
window.addEventListener('pagehide',()=>syncSteps());
/* iOS 加到主屏的一次性引导：装成图标才有回访入口 */
(function(){
  try{
    const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
    if(!ios||navigator.standalone)return;
    if(localStorage.getItem('outie.a2hs'))return;
    localStorage.setItem('outie.a2hs','1');
    setTimeout(()=>toast('用 Safari 的「分享 → 添加到主屏幕」，下次从图标直接进 OUTIE。'),2500);
  }catch(e){}
})();
boot();
